buildscript {
    repositories {
        maven { url = file("$rootDir/gradle/local-maven") }
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
    dependencies {
        // maven.architectury.dev stalls on some networks; resolve the plugin and
        // loom from the local mirror (exact upstream jars). 3.5 is needed for the
        // NEOFORGE mod loader constant; loom 1.17 for modern MC.
        classpath 'architectury-plugin:architectury-plugin.gradle.plugin:3.5.0-local@jar'
        classpath 'dev.architectury:architectury-loom:1.17.1-local'
        classpath 'dev.architectury:architectury-transformer:5.2.92'
        classpath 'dev.architectury:mercury:0.4.3.18'
        classpath 'dev.architectury:refmap-remapper:1.0.5'
        classpath 'dev.architectury:at:1.0.1'
        classpath 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.3.72'
        classpath 'org.jetbrains.gradle.plugin.idea-ext:org.jetbrains.gradle.plugin.idea-ext.gradle.plugin:1.4.1'
    }
}

plugins {
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

// architectury-plugin applied via the artifact-only classpath above
apply plugin: 'architectury-plugin'

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        flatDir {
            dirs "$rootProject.projectDir/lib"
        }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven { url "https://maven.shedaniel.me" }
        maven { url "https://maven.terraformersmc.com/" }
        maven {
            name = "Ladysnake Libs"
            url = 'https://maven.ladysnake.org/releases'
        }
        // cursemaven times out on this network; the exact jars are mirrored
        // locally, so force curse.maven to resolve exclusively from there
        exclusiveContent {
            forRepository { maven { url = file("$rootDir/gradle/local-maven") } }
            filter { includeGroup 'curse.maven' }
        }
        exclusiveContent {
            forRepository { maven { url = file("$rootDir/gradle/local-maven") } }
            filter { includeGroup "org.ladysnake.cardinal-components-api" }
        }
        mavenCentral()
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

tasks.register("publishModsDry") {
    group = "upload"
    description = "Dry run publishing for every loader — writes to build/unified-dry/."
    dependsOn ":fabric:publishModsDry", ":neoforge:publishModsDry"
}
